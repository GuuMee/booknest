name: booknest
description: "Your personal reading companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.0

  wakelock_plus: ^1.2.8

  # ─── State Management ───────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ─── Navigation ─────────────────────────────────────────
  go_router: ^13.2.0

  timeago: ^3.6.1

  # ─── PDF Rendering ──────────────────────────────────────
  syncfusion_flutter_pdfviewer: ^24.1.0   # Best PDF viewer
  # OR
  flutter_pdfview: ^1.3.2                 # Lightweight alternative
  # OR
  pdfrx: ^1.0.0                           # Newer, performant option

  # ─── Network ────────────────────────────────────────────
  dio: ^5.4.3
  #retrofit: ^4.1.0

  # ─── Local Storage ──────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2

  # ─── Dependency Injection ───────────────────────────────
  get_it: ^7.6.7
  injectable: ^2.3.2

  # ─── UI/UX ──────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  animations: ^2.0.11
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  # ✅ ADDED from top code
  flutter_rating_bar: ^4.0.1

  # ─── File Management ────────────────────────────────────
  path_provider: ^2.1.3
  open_file: ^3.3.2
  file_picker: ^8.0.0
  flutter_downloader: ^1.11.6

  # ─── Payments / Subscriptions ───────────────────────────
  in_app_purchase: ^3.1.11
  # OR
  purchases_flutter: ^6.15.0              # RevenueCat (recommended)

  # ─── Authentication ─────────────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # ─── Firebase ───────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1

  # ─── Notifications ──────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ─── Text-to-Speech ─────────────────────────────────────
  flutter_tts: ^4.0.2

  # ─── Utils ──────────────────────────────────────────────
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  device_info_plus: ^9.0.2
  package_info_plus: ^8.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_cache_manager: ^3.3.1

  # ─── Icons ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  injectable_generator: ^2.4.1
  #retrofit_generator: ^6.0.0
  #hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  # ✅ ADDED from top code
  bloc_test: ^9.1.5
  # ✅ ADDED from top code
  mocktail: ^1.0.3
  #mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  # ✅ ADDED from top code
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900